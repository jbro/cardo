CONFIG_SPI=y
CONFIG_GPIO_595=y
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# Persist BLE bonds and profile selection in the XIAO's storage partition.
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# Scan on GPIO interrupts instead of continuously polling the 595 chains.
# This lets the MCU sleep between key presses.
# CONFIG_ZMK_KSCAN_MATRIX_POLLING is intentionally disabled.

# Deep sleep/System OFF is disabled because the shift-register matrix cannot
# reliably wake the XIAO from System OFF. BLE remains available while idle.
